<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DataNova — Reset Password</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/forgot_password.css') }}" />
<link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/favicon.png') }}">
</head>
<body>

<div class="login-shell">

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <a href="{{ url_for('dashboards.index') }}" class="brand" style="text-decoration: none; color: inherit;">
      <div style="width: 36px; height: 36px; background: linear-gradient(135deg, #4F46E5, #7C3AED, #06B6D4); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.1rem; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);">
        <i class="bi bi-cpu-fill"></i>
      </div>
      <span style="font-weight: 700; font-size: 1.3rem; letter-spacing: -0.02em; color: #000000;">Data<span style="color: #4F46E5;">Nova</span></span>
    </a>

    <div class="characters-wrap">
      <div class="characters" id="characters">

        <!-- PURPLE (tallest, back) -->
        <div class="char char-purple" id="purple">
          <div class="face" id="purple-face">
            <div class="eye" id="purple-eye-1" data-size="18" data-pupil="7" data-max="5">
              <div class="pupil"></div>
            </div>
            <div class="eye" id="purple-eye-2" data-size="18" data-pupil="7" data-max="5">
              <div class="pupil"></div>
            </div>
          </div>
        </div>

        <!-- BLACK -->
        <div class="char char-black" id="black">
          <div class="face" id="black-face">
            <div class="eye" id="black-eye-1" data-size="16" data-pupil="6" data-max="4">
              <div class="pupil"></div>
            </div>
            <div class="eye" id="black-eye-2" data-size="16" data-pupil="6" data-max="4">
              <div class="pupil"></div>
            </div>
          </div>
        </div>

        <!-- ORANGE -->
        <div class="char char-orange" id="orange">
          <div class="face" id="orange-face">
            <div class="pupil-only" id="orange-pupil-1" data-size="12" data-max="5"></div>
            <div class="pupil-only" id="orange-pupil-2" data-size="12" data-max="5"></div>
          </div>
        </div>

        <!-- YELLOW (front) -->
        <div class="char char-yellow" id="yellow">
          <div class="face" id="yellow-face">
            <div class="pupil-only" id="yellow-pupil-1" data-size="12" data-max="5"></div>
            <div class="pupil-only" id="yellow-pupil-2" data-size="12" data-max="5"></div>
          </div>
          <div class="mouth" id="yellow-mouth"></div>
        </div>

      </div>
    </div>

    <div class="footer-links">
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Service</a>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="login-card">

      <a href="{{ url_for('dashboards.index') }}" class="mobile-brand" style="text-decoration: none; color: inherit;">
        <div style="width: 32px; height: 32px; background: linear-gradient(135deg, #4F46E5, #7C3AED, #06B6D4); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white;">
          <i class="bi bi-cpu-fill"></i>
        </div>
        <span style="font-weight: 700; font-size: 1.2rem; color: #000000;">Data<span style="color: #4F46E5;">Nova</span></span>
      </a>

      <div class="header-text">
        <p class="eyebrow">Password Recovery</p>
        <h1>Reset your password</h1>
        <p class="subtitle">Enter your registered email address & new password</p>
      </div>

      <form id="forgot-form" novalidate>
        <div class="field">
          <label for="email">Email Address</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" class="login-input" />
          <p class="field-error" id="email-error"></p>
        </div>

        <div class="field">
          <label for="password">New Password</label>
          <div class="password-wrap">
            <input id="password" type="password" placeholder="••••••••" autocomplete="new-password" class="login-input" />
            <button type="button" class="toggle-password" id="toggle-password" aria-label="Toggle password visibility">
              <svg id="eye-closed" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-.722-3.25"/><path d="M2 8a10.645 10.645 0 0 0 20 0"/><path d="m20 15-1.726-2.05"/><path d="m4 15 1.726-2.05"/><path d="m9 18 .722-3.25"/></svg>
              <svg id="eye-open" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="field-error" id="password-error"></p>
        </div>

        <div class="field">
          <label for="confirm_password">Confirm New Password</label>
          <input id="confirm_password" type="password" placeholder="••••••••" autocomplete="new-password" class="login-input" />
          <p class="field-error" id="confirm-password-error"></p>
        </div>

        <div class="form-error" id="form-error" style="display:none"></div>

        <button type="submit" class="hover-btn hover-btn-primary full" id="submit-btn">
          <span class="btn-label" id="submit-label">Reset Password</span>
          <span class="btn-hover">
            <span id="submit-label-hover">Reset Password</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>
          </span>
        </button>
      </form>

      <div class="signup-text">
        Remembered your password? <a href="{{ url_for('auth.login') }}">Log in</a>
      </div>

    </div>
  </div>

</div>

<script src="{{ url_for('static', filename='js/forgot_password.js') }}"></script>
</body>
</html>
